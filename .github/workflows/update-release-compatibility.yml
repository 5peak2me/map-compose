name: Update release compatibility

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Update compatibility table
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          git check-ref-format --allow-onelevel "${tag}"
          tag_ref="refs/tags/${tag}"
          git rev-parse --verify --quiet "${tag_ref}^{commit}" > /dev/null || {
            echo "Release tag ${tag} does not exist" >&2
            exit 1
          }

          readonly_file() {
            git show "${tag_ref}:$1"
          }

          catalog="$(readonly_file gradle/libs.versions.toml)"
          wrapper="$(readonly_file gradle/wrapper/gradle-wrapper.properties)"

          version() {
            awk -F ' = ' -v key="$1" '$1 == key { gsub(/"/, "", $2); print $2; exit }' <<<"${catalog}"
          }

          kotlin="$(version kotlin)"
          compose="$(version composeBom)"
          agp="$(version agp)"
          compile_sdk="$(version compileSdk)"
          min_sdk="$(version minSdk)"
          gradle="$(sed -nE 's#^distributionUrl=.*gradle-([0-9.]+)-(bin|all)\.zip$#\1#p' <<<"${wrapper}")"

          for value in "${kotlin}" "${compose}" "${agp}" "${compile_sdk}" "${min_sdk}" "${gradle}"; do
            test -n "${value}" || { echo "Required release version is missing" >&2; exit 1; }
          done

          if ! heading_line="$(awk '$0 == "## Kotlin / Compose 版本兼容性" { count++; line = NR } END { if (count == 1) print line; else exit 1 }' README.md)"; then
            echo 'Compatibility heading not found or is ambiguous' >&2
            exit 1
          fi

          if ! delimiter_line="$(awk -v start="${heading_line}" 'NR <= start { next } /^## / { exit 1 } $0 ~ /^\|[-|]+\|$/ { print NR; found = 1; exit } END { if (!found) exit 1 }' README.md)"; then
            echo 'Compatibility table delimiter not found' >&2
            exit 1
          fi

          tag_url="$(jq -rn --arg value "${tag}" '$value | @uri')"
          marker="raw.githubusercontent.com/5peak2me/map-compose/${tag_url}/gradle/libs.versions.toml"
          if awk -v start="${delimiter_line}" -v marker="${marker}" 'NR <= start { next } /^\|/ { if (index($0, marker)) found = 1; next } { exit } END { exit !found }' README.md; then
            echo "Compatibility row for ${tag} already exists"
            exit 0
          fi

          versions_url="https://raw.githubusercontent.com/5peak2me/map-compose/${tag_url}/gradle/libs.versions.toml"
          wrapper_url="https://raw.githubusercontent.com/5peak2me/map-compose/${tag_url}/gradle/wrapper/gradle-wrapper.properties"
          row="| [${tag}](https://jitpack.io/#5peak2me/map-compose/${tag_url}) | [![Kotlin](https://img.shields.io/badge/dynamic/toml?url=${versions_url}&query=%24.versions.kotlin&label=Kotlin&color=blue&logo=kotlin)](https://kotlinlang.org) | [![Compose](https://img.shields.io/badge/dynamic/toml?url=${versions_url}&query=%24.versions.composeBom&label=Compose&color=blue&logo=android)](https://developer.android.com/jetpack/compose) | [![AGP](https://img.shields.io/badge/dynamic/toml?url=${versions_url}&query=%24.versions.agp&label=AGP&color=blue&logo=android)](https://developer.android.com/build/releases/gradle-plugin) | [![compileSdk](https://img.shields.io/badge/dynamic/toml?url=${versions_url}&query=%24.versions.compileSdk&label=compileSdk&color=green&logo=android)](https://developer.android.com/guide/) | [![minSdk](https://img.shields.io/badge/dynamic/toml?url=${versions_url}&query=%24.versions.minSdk&label=minSdk&color=green&logo=android)](https://developer.android.com/guide/) | [![Gradle](https://img.shields.io/badge/dynamic/regex?url=${wrapper_url}&search=gradle-([0-9.]%2B)-(?:bin%7Call).zip&replace=%241&label=Gradle&color=blue&logo=gradle)](https://gradle.org) |"

          awk -v line="${delimiter_line}" -v row="${row}" 'NR == line { print; print row; next } { print }' README.md > README.md.tmp
          mv README.md.tmp README.md
          printf 'RELEASE_TAG=%s\n' "${tag}" >> "${GITHUB_ENV}"

      - name: Commit compatibility table update
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if git diff --quiet -- README.md; then
            echo "README compatibility table is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update compatibility for ${RELEASE_TAG}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
